[project]
name = "akkadian-streaming-translator"
version = "0.1.0"
description = "Low-resource Akkadian to English NMT with streaming translator UI."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Fomin Pavel Andreevich" }
]
dependencies = [
  "accelerate>=0.33.0",
  "datasets>=2.20.0",
  "evaluate>=0.4.2",
  "fastapi>=0.111.0",
  "fire>=0.6.0",
  "kaggle>=1.6.17",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "sacrebleu>=2.4.0",
  "scikit-learn>=1.5.0",
  "sentencepiece>=0.2.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "uvicorn[standard]>=0.30.0",
  "wandb>=0.17.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]
comet = [
  "unbabel-comet>=2.2.0"
]

[project.scripts]
akkadian-mt = "model:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akkadian_mt"]

[tool.hatch.build.targets.wheel.force-include]
"model.py" = "model.py"
"api" = "api"
"web" = "web"
"scripts" = "scripts"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
